services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: transferhub
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: transferhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferhub -d transferhub"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
