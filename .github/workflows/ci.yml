name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: transferhub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: transferhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U transferhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://transferhub:ci-only-password@127.0.0.1:5432/transferhub
      DIAGNOSTICS_TOKEN: ci-only-token-not-valid-for-deployment-123456789
      NODE_ENV: test
      PLATFORM_MODE: sandbox
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --import tsx scripts/migrate.ts
      - run: npm run test:postgres
      - run: npm run build
